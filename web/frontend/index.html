<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>change-bios-logo — Web 版</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-blobs" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>

  <div class="container">
    <header class="card">
      <h1>change-bios-logo</h1>
      <p class="subtitle">替换 UEFI/BIOS 固件里的开机 Logo 图片，并重新打包成 BIOS 文件（输出与输入严格等长）</p>
    </header>

    <!-- 步骤 1：载入 BIOS 文件 -->
    <section class="card" id="step-scan">
      <h2>1. 载入 BIOS 文件</h2>
      <div class="row">
        <input type="file" id="bios-file" accept=".bin,.bin,.F44d,.f44d,.cap,.cap,.rom">
        <button id="btn-scan" class="btn primary" disabled>扫描</button>
      </div>
      <div id="scan-result" class="hidden"></div>
    </section>

    <!-- 步骤 2：上传新 Logo -->
    <section class="card" id="step-upload">
      <h2>2. 上传新 Logo</h2>
      <div class="row">
        <input type="file" id="logo-file" accept="image/*">
        <button id="btn-preview" class="btn" disabled>预览适配效果</button>
      </div>
      <div id="preview-result" class="hidden"></div>
    </section>

    <!-- 步骤 3：适配参数 -->
    <section class="card" id="step-adapt">
      <h2>3. 适配参数</h2>
      <div class="row">
        <label class="field">
          目标 Logo 段
          <select id="slot-select">
            <option value="0">— 扫描后填充 —</option>
          </select>
        </label>
        <label class="field">
          适配方式
          <select id="fit-mode">
            <option value="contain">完整显示</option>
            <option value="cover">铺满裁剪</option>
            <option value="stretch">拉伸填满</option>
          </select>
        </label>
        <label class="field">
          缩放
          <span class="inline-size">
            <input type="range" id="zoom-slider" min="30" max="300" value="100" step="1">
            <span id="zoom-label">1.00×</span>
          </span>
        </label>
        <button id="btn-fit-reset" class="btn ghost" type="button">重置</button>
        <button id="btn-crop" class="btn ghost" type="button" disabled>裁剪图片…</button>
      </div>
      <div class="row">
        <label class="field">
          输出尺寸
          <select id="output-size">
            <option value="orig">跟原 Logo 一样（最保险）</option>
            <option value="source">原图（上传图片的像素尺寸）</option>
            <option value="fixed">720×480</option>
            <option value="custom">自定义（可填 W×H）</option>
          </select>
        </label>
        <label class="field hidden" id="custom-size-label">
          自定义
          <span class="inline-size">
            <input type="number" id="custom-width" min="8" max="8192" placeholder="宽">
            <span>×</input>
            <input type="number" id="custom-height" min="8" max="8192" placeholder="高">
          </span>
        </label>
      </div>
      <div class="row">
        <label class="field">
          颜色位深
          <select id="color-depth">
            <option value="24">24 位（与原 Logo 同格式，默认）</option>
            <option value="8">8 位 / 256 色（未验证）</option>
            <option value="4">4 位 / 16 色（未验证，最省）</option>
            <option value="1">1 位 / 黑白（未验证）</option>
          </select>
        </label>
        <label class="field checkbox">
          <input type="checkbox" id="auto-trim"> 自动去黑边
        </label>
        <label class="field checkbox">
          <input type="checkbox" id="auto-shrink" checked> 放不下时自动缩小
        </label>
      </div>
      <p class="hint" id="fit-tip"></p>
    </section>

    <!-- 步骤 4：替换并保存 -->
    <section class="card" id="step-replace">
      <h2>4. 替换并保存</h2>
      <div class="row">
        <button id="btn-replace" class="btn primary" disabled>替换并下载</button>
        <a id="download-link" class="hidden" download>下载新 BIOS 文件</a>
      </div>
      <p class="hint" id="replace-hint">先完成前 3 步，再点「替换并下载」。</p>
    </section>

    <!-- 日志 -->
    <section class="card" id="log-card">
      <h2>日志</h2>
      <pre id="log" class="log"></pre>
    </section>
  </div>

  <!-- 裁剪图片对话框（modal，对齐桌面版 CropDialog：拖框框选 + 锁定比例 + 全选/按目标比例/去黑边/还原） -->
  <div class="crop-overlay hidden" id="crop-overlay">
    <div class="crop-dialog">
      <div class="crop-title">裁剪图片</div>
      <div class="crop-canvas-wrap">
        <canvas id="crop-canvas" width="640" height="400"></canvas>
      </div>
      <div class="crop-bar">
        <label class="field checkbox">
          <input type="checkbox" id="crop-lock"> 锁定比例
          <span class="crop-aspect" id="crop-aspect"></span>
        </label>
        <button class="btn ghost" id="crop-sel-all" type="button">全选</button>
        <button class="btn ghost" id="crop-sel-aspect" type="button">按目标比例</button>
        <button class="btn ghost" id="crop-sel-content" type="button">去黑边</button>
        <button class="btn ghost" id="crop-restore" type="button">还原</button>
      </div>
      <div class="crop-size" id="crop-size"></div>
      <div class="crop-foot">
        <button class="btn ghost" id="crop-cancel" type="button">取消</button>
        <button class="btn primary" id="crop-ok" type="button">确定</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
